version: 2
# Minor and patch updates are grouped per ecosystem: usually safe, one PR to
# merge. Major updates are NOT grouped, so each arrives as its own PR and a
# risky migration (e.g. AGP 9) can't hold back the routine bumps.
updates:
  - package-ecosystem: uv
    directory: /server
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /admin
    schedule: { interval: weekly }
    groups:
      admin: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    groups:
      android: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # A new Python (3.12 -> 3.15) needs onnxruntime wheels for it first, or the image
      # build fails (Piper read-aloud). Bump Python by hand, together with server/, once
      # onnxruntime supports it; patch releases of 3.12 still arrive.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
