name: docker

on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "apk-bundle/**", "server/**", "admin/**", ".github/workflows/docker.yml"]
  push:
    branches: [main]
  # Release tags are built by release.yml, which bakes the signed APK into the image.

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PRs: build amd64 only and smoke-test /healthz. main: multi-arch push.
      - name: Build (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kidsmedia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (PR)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name km -p 8080:8080 -e ADMIN_PASSWORD=ci-smoke-test kidsmedia:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz || { docker logs km; exit 1; }
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec km ffprobe -version | head -1
          docker rm -f km
      - name: Build and push (main)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
