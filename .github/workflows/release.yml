name: release

# SPEC §10.2: a tag v1.2.3 publishes the image ghcr.io/docdru/kidsmedia:1.2.3 and a GitHub
# Release. This public image carries no APK: the signed APK, JOY and the family's story
# packs are added by the private family image, which builds FROM this tag (SPEC §4.3,
# deploy/README.md → "Family image"). Images without an APK still serve tablets that were
# installed by hand; they just don't update them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Version from the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand in the web UI (which also creates the tag) already exists.
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Kids Media ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi
