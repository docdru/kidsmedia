# Kids Media — nginx snippet (SPEC §4.1).
#
# Include these locations in the server block that already terminates TLS for
# your media domain (Let's Encrypt), e.g.:
#
#   server {
#       listen 443 ssl http2;
#       server_name media.example.com;
#       ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;
#       include /etc/nginx/snippets/kidsmedia.conf;
#   }
#
# HTTPS only (SPEC §7): send plain HTTP to HTTPS, e.g.
#
#   server {
#       listen 80;
#       server_name media.example.com;
#       location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
#       location / { return 301 https://$host$request_uri; }
#   }
#

# Request bodies (SPEC §7): small by default, because the app reads a JSON body into
# memory before it checks the login. Only the upload paths below take more; they check
# the login first and stream. Keep them in step with server/src/kidsmedia/limits.py.
client_max_body_size 2m;

# The app's address: the one place for the port, which must match KM_PORT in
# /opt/kidsmedia/.env. Every location below uses it, the upload locations too, so a
# changed port can't send some paths to another service on 8080. (An IP address needs no
# resolver; with no URI after the variable nginx passes the request URI unchanged.)
set $km_backend http://127.0.0.1:8080;

# Browsers (the admin) must never fall back to HTTP. Repeated in every location
# below, because an add_header inside a location replaces the outer ones.
set $km_hsts "max-age=31536000";

location / {
    proxy_pass $km_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Only the address nginx itself saw. Not $proxy_add_x_forwarded_for: that keeps what
    # the client sent, and the login and pairing limits count by this address (SPEC §7).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;   # stream uploads straight to the app
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Strict-Transport-Security $km_hsts always;

    # Uploads. The proxy_* settings and the header above are inherited; proxy_pass is not.
    # Media files: MAX_UPLOAD_MB in .env (default 4096).
    location ~ ^/api/admin/groups/[0-9]+/upload$ {
        client_max_body_size 4g;
        proxy_pass $km_backend;
    }
    # The app for the tablets (at most 200 MB).
    location = /api/admin/app/apk {
        client_max_body_size 210m;
        proxy_pass $km_backend;
    }
    # A story pack (at most 50 MB).
    location = /api/admin/worlds/import {
        client_max_body_size 64m;
        proxy_pass $km_backend;
    }
    # Pictures: covers, thumbnails, chapter pictures (20 MB) and the child's photos (15 MB).
    location ~ ^/api/(admin/(groups/[0-9]+/cover|media/[0-9]+/thumb|worlds/[0-9]+/cover|worlds/[0-9]+/chapters/[0-9]+/image)|activities/photo)$ {
        client_max_body_size 25m;
        proxy_pass $km_backend;
    }
}

# Only reachable through X-Accel-Redirect from the app after it has checked
# the device token and the rules. Never expose these paths directly.
location /_media/ {
    internal;
    alias /opt/kidsmedia/data/media/;
    add_header Cache-Control "private, max-age=86400";
    add_header Strict-Transport-Security $km_hsts always;
}

location /_thumbs/ {
    internal;
    alias /opt/kidsmedia/data/thumbs/;
    add_header Cache-Control "private, max-age=31536000, immutable";
    add_header Strict-Transport-Security $km_hsts always;
}

# Signed app updates for the tablets (SPEC §4.3), also only via X-Accel-Redirect.
location /_apk/ {
    internal;
    alias /opt/kidsmedia/data/apk/;
    add_header Cache-Control "private, no-cache";
    add_header Strict-Transport-Security $km_hsts always;
}
