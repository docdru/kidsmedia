# Kids Media — nginx snippet (SPEC §4.1).
#
# Include these locations in the server block that already terminates TLS for
# your media domain (Let's Encrypt), e.g.:
#
#   server {
#       listen 443 ssl http2;
#       server_name media.example.com;
#       ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;
#       include /etc/nginx/snippets/kidsmedia.conf;
#   }
#
# HTTPS only (SPEC §7): send plain HTTP to HTTPS, e.g.
#
#   server {
#       listen 80;
#       server_name media.example.com;
#       location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
#       location / { return 301 https://$host$request_uri; }
#   }
#
# Port 8080 must match KM_PORT in /opt/kidsmedia/.env.

client_max_body_size 4g;

# Browsers (the admin) must never fall back to HTTP. Repeated in every location
# below, because an add_header inside a location replaces the outer ones.
set $km_hsts "max-age=31536000";

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;   # stream uploads straight to the app
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Strict-Transport-Security $km_hsts always;
}

# Only reachable through X-Accel-Redirect from the app after it has checked
# the device token and the rules. Never expose these paths directly.
location /_media/ {
    internal;
    alias /opt/kidsmedia/data/media/;
    add_header Cache-Control "private, max-age=86400";
    add_header Strict-Transport-Security $km_hsts always;
}

location /_thumbs/ {
    internal;
    alias /opt/kidsmedia/data/thumbs/;
    add_header Cache-Control "private, max-age=31536000, immutable";
    add_header Strict-Transport-Security $km_hsts always;
}

# Signed app updates for the tablets (SPEC §4.3), also only via X-Accel-Redirect.
location /_apk/ {
    internal;
    alias /opt/kidsmedia/data/apk/;
    add_header Cache-Control "private, no-cache";
    add_header Strict-Transport-Security $km_hsts always;
}
