[project]
name = "kidsmedia"
version = "0.1.0"
description = "Self-hosted media server with usage rules for a child's tablet"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pillow>=11.0",
    "mutagen>=1.47",
    # Read aloud (SPEC §14.3). 1.3+ is the OHF-Voice/piper1-gpl line (GPL-3.0); it runs as a
    # separate process (`python -m piper`), never imported. Wheels are abi3 for linux x86_64
    # and aarch64.
    "piper-tts>=1.3,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.120",
]

[project.scripts]
kidsmedia = "kidsmedia.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kidsmedia"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "e2e"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is idiomatic
    "S603",  # subprocess without shell: we call ffmpeg/ffprobe with argument lists
    "S607",  # ffmpeg/ffprobe are resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"e2e/**" = ["S101", "S105", "S106"]
"src/kidsmedia/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "e2e"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mutagen", "mutagen.*", "piper", "piper.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kidsmedia.migrations.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]
