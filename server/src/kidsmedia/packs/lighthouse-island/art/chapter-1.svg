<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Chapter 1: Mira's lighthouse. The morning after the storm: the lamp is out, Mira waves, Pip flies home. -->
  <!-- sky -->
  <rect width="1024" height="1024" fill="#FBE3C8"/>
  <circle cx="170" cy="170" r="78" fill="#FFD34D"/>
  <g fill="#FFFFFF">
    <ellipse cx="820" cy="200" rx="100" ry="38"/>
    <ellipse cx="880" cy="176" rx="62" ry="44"/>
    <ellipse cx="420" cy="140" rx="70" ry="26"/>
    <ellipse cx="455" cy="124" rx="42" ry="28"/>
  </g>
  <!-- sea -->
  <rect y="680" width="1024" height="344" fill="#2E6FA8"/>
  <path d="M0 730 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#7FB2DD" stroke-width="12" stroke-linecap="round"/>
  <path d="M0 900 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#5A93C7" stroke-width="12" stroke-linecap="round"/>
  <!-- far ship waiting -->
  <g stroke="#1B2440" stroke-width="8" stroke-linejoin="round">
    <path d="M870 690 L990 690 L970 720 L890 720 Z" fill="#4552C7"/>
    <path d="M930 690 L930 610 L975 682 Z" fill="#FFFFFF"/>
  </g>
  <!-- island -->
  <path d="M150 770 Q290 620 520 625 Q760 620 870 770 Z" fill="#E9C27A" stroke="#1B2440" stroke-width="10" stroke-linejoin="round"/>
  <path d="M760 720 q20 -36 56 -8" fill="none" stroke="#C99A4B" stroke-width="10" stroke-linecap="round"/>
  <!-- lighthouse, lamp dark -->
  <g transform="translate(600,668) scale(1.1) translate(-512,-640)">
    <polygon points="430,640 594,640 566,300 458,300" fill="#FFFFFF" stroke="#1B2440" stroke-width="10" stroke-linejoin="round"/>
    <polygon points="440,520 584,520 576,430 448,430" fill="#D2452E"/>
    <polygon points="451,390 573,390 568,330 456,330" fill="#D2452E"/>
    <rect x="488" y="560" width="48" height="80" rx="20" fill="#3B4560" stroke="#1B2440" stroke-width="8"/>
    <rect x="436" y="276" width="152" height="26" rx="6" fill="#1B2440"/>
    <rect x="466" y="196" width="92" height="80" fill="#5B6683" stroke="#1B2440" stroke-width="10"/>
    <polygon points="452,196 572,196 512,128" fill="#D2452E" stroke="#1B2440" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="512" cy="122" r="10" fill="#1B2440"/>
  </g>
  <!-- Mira, waving -->
  <g transform="translate(320,688) scale(1.4)">
    <g stroke="#1B2440" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M24 -64 L60 -112" fill="none"/>
      <path d="M-24 -64 L-48 -30" fill="none"/>
      <circle cx="62" cy="-116" r="9" fill="#F2C9A0"/>
      <circle cx="-50" cy="-27" r="9" fill="#F2C9A0"/>
      <path d="M-45 0 L-27 -80 L27 -80 L45 0 Z" fill="#4552C7"/>
      <circle cx="0" cy="-120" r="44" fill="#F2C9A0"/>
      <path d="M-45 -125 Q-45 -175 0 -174 Q47 -175 45 -125 Q27 -150 0 -148 Q-27 -150 -45 -125 Z" fill="#7A3E1D"/>
    </g>
    <circle cx="-15" cy="-118" r="6" fill="#1B2440"/>
    <circle cx="15" cy="-118" r="6" fill="#1B2440"/>
    <path d="M-13 -98 q13 12 26 0" fill="none" stroke="#1B2440" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Pip flying home -->
  <g transform="translate(300,330) scale(1.3)">
    <g stroke="#1B2440" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-80 -12 q40 -60 80 0" fill="none"/>
      <path d="M0 -12 q40 -60 80 0" fill="none"/>
      <ellipse cx="0" cy="0" rx="30" ry="20" fill="#FFFFFF"/>
    </g>
    <polygon points="26,-4 50,2 26,8" fill="#F2A23A"/>
    <circle cx="12" cy="-6" r="4" fill="#1B2440"/>
  </g>
</svg>
