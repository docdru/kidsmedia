<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Chapter 3: A letter for the ship. Pip flies Mira's letter out to the captain's ship. -->
  <!-- sky -->
  <rect width="1024" height="1024" fill="#FBE3C8"/>
  <circle cx="880" cy="150" r="72" fill="#FFD34D"/>
  <g fill="#FFFFFF">
    <ellipse cx="200" cy="150" rx="96" ry="36"/>
    <ellipse cx="260" cy="128" rx="58" ry="40"/>
    <ellipse cx="620" cy="230" rx="70" ry="26"/>
    <ellipse cx="655" cy="214" rx="42" ry="28"/>
