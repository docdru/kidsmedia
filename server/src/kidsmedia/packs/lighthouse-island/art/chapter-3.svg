    <polygon points="452,196 572,196 512,128" fill="#D2452E" stroke="#1B2440" stroke-width="22" stroke-linejoin="round"/>
  </g>
  <!-- Pip's flight path -->
  <path d="M230 470 Q280 380 340 380" fill="none" stroke="#C9B49A" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 26"/>
