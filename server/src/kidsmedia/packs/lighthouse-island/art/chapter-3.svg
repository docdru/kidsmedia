  <!-- sea -->
  <rect y="620" width="1024" height="404" fill="#2E6FA8"/>
  <path d="M0 790 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#7FB2DD" stroke-width="12" stroke-linecap="round"/>
  <path d="M0 920 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#5A93C7" stroke-width="12" stroke-linecap="round"/>
  <!-- the island with the lighthouse, far away -->
  <path d="M20 650 Q120 570 250 650 Z" fill="#E9C27A" stroke="#1B2440" stroke-width="10" stroke-linejoin="round"/>
  <g transform="translate(135,624) scale(0.42) translate(-512,-640)">
