  <g fill="none" stroke="#C99A4B" stroke-width="10" stroke-linecap="round">
    <path d="M20 922 L120 922"/>
    <path d="M180 832 L270 832"/>
    <path d="M330 742 L420 742"/>
    <path d="M480 652 L570 652"/>
    <path d="M630 562 L720 562"/>
    <path d="M790 472 L1000 472"/>
  </g>
  <!-- Mira carrying the lamp -->
  <g transform="translate(375,720) scale(1.5)">
    <g stroke="#1B2440" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-45 0 L-27 -80 L27 -80 L45 0 Z" fill="#4552C7"/>
      <circle cx="0" cy="-120" r="44" fill="#F2C9A0"/>
      <path d="M-45 -125 Q-45 -175 0 -174 Q47 -175 45 -125 Q27 -150 0 -148 Q-27 -150 -45 -125 Z" fill="#7A3E1D"/>
      <path d="M-24 -66 L-40 -44 M24 -66 L40 -44" fill="none"/>
      <path d="M-40 -62 L-28 -80 L28 -80 L40 -62 Z" fill="#D2452E"/>
      <rect x="-30" y="-62" width="60" height="42" rx="5" fill="#FFD34D"/>
      <path d="M0 -62 L0 -20" fill="none"/>
      <rect x="-36" y="-22" width="72" height="16" rx="4" fill="#5B6683"/>
      <circle cx="-38" cy="-42" r="8" fill="#F2C9A0"/>
      <circle cx="38" cy="-42" r="8" fill="#F2C9A0"/>
    </g>
    <circle cx="-15" cy="-118" r="6" fill="#1B2440"/>
    <circle cx="15" cy="-118" r="6" fill="#1B2440"/>
    <path d="M-13 -98 q13 12 26 0" fill="none" stroke="#1B2440" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Pip flying beside -->
