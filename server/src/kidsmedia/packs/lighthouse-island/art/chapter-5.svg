<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Chapter 5: Up the stairs. Inside the lighthouse, Mira carries the lamp up step by step, Pip flies beside her. -->
  <!-- inside wall -->
  <rect width="1024" height="1024" fill="#F3D3A8"/>
  <g fill="none" stroke="#E2BB88" stroke-width="10" stroke-linecap="round">
    <path d="M520 120 l120 0"/>
    <path d="M580 180 l120 0"/>
    <path d="M60 560 l110 0"/>
    <path d="M110 620 l110 0"/>
  </g>
  <!-- round window -->
  <circle cx="220" cy="270" r="112" fill="#FBE3C8"/>
  <path d="M108 270 A112 112 0 0 0 332 270 Z" fill="#2E6FA8"/>
  <path d="M130 330 q22 -16 44 0 t44 0 t44 0 t44 0" fill="none" stroke="#7FB2DD" stroke-width="10" stroke-linecap="round"/>
  <circle cx="270" cy="220" r="30" fill="#FFD34D"/>
  <circle cx="220" cy="270" r="112" fill="none" stroke="#1B2440" stroke-width="12"/>
  <path d="M108 270 L332 270 M220 158 L220 382" fill="none" stroke="#1B2440" stroke-width="10"/>
  <!-- door at the top -->
  <path d="M840 450 L840 300 Q840 240 900 240 Q960 240 960 300 L960 450 Z" fill="#5B6683" stroke="#1B2440" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="940" cy="360" r="8" fill="#FFD34D"/>
