  <!-- sea -->
  <rect y="640" width="1024" height="384" fill="#22558C"/>
  <path d="M0 690 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#4F86BD" stroke-width="12" stroke-linecap="round"/>
  <path d="M0 930 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#3E74AA" stroke-width="12" stroke-linecap="round"/>
  <!-- island -->
  <path d="M170 700 Q300 580 512 590 Q760 580 860 700 Z" fill="#E9C27A" stroke="#1B2440" stroke-width="10" stroke-linejoin="round"/>
