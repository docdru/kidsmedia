<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Chapter 6: Light on! At night the lighthouse shines again and the ships come home safely. -->
  <!-- night sky -->
  <rect width="1024" height="1024" fill="#2A3768"/>
  <circle cx="140" cy="80" r="56" fill="#FFF1C2"/>
  <circle cx="168" cy="60" r="50" fill="#2A3768"/>
  <g fill="#FFD34D">
    <circle cx="330" cy="110" r="8"/>
    <circle cx="90" cy="330" r="7"/>
    <circle cx="300" cy="300" r="6"/>
    <circle cx="700" cy="90" r="8"/>
    <circle cx="900" cy="80" r="6"/>
    <circle cx="960" cy="470" r="7"/>
    <circle cx="640" cy="420" r="6"/>
    <circle cx="420" cy="420" r="6"/>
  </g>
  <!-- light beams -->
  <g fill="#FFE9A0">
    <polygon points="512,236 0,140 0,330"/>
    <polygon points="512,236 1024,150 1024,330"/>
