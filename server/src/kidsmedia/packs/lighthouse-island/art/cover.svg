  <g stroke="#1B2440" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M300 640 L318 560 L372 560 L390 640 Z" fill="#4552C7"/>
    <circle cx="345" cy="520" r="44" fill="#F2C9A0"/>
