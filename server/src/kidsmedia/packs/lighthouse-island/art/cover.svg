<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Lighthouse Island: cover. Style reference for all pack art (SPEC §13.5). -->
  <!-- sky -->
  <rect width="1024" height="1024" fill="#FBE3C8"/>
  <circle cx="820" cy="210" r="92" fill="#FFD34D"/>
  <!-- clouds -->
  <g fill="#FFFFFF">
    <ellipse cx="210" cy="190" rx="110" ry="42"/>
    <ellipse cx="290" cy="165" rx="70" ry="48"/>
    <ellipse cx="610" cy="300" rx="80" ry="30"/>
    <ellipse cx="660" cy="282" rx="50" ry="34"/>
