  <!-- sea -->
  <rect y="640" width="1024" height="384" fill="#2E6FA8"/>
  <path d="M0 690 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#7FB2DD" stroke-width="12" stroke-linecap="round"/>
  <path d="M0 860 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#5A93C7" stroke-width="12" stroke-linecap="round"/>
  <!-- island -->
